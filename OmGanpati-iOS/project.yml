name: OmGanpati
options:
  bundleIdPrefix: in.omganpati
  deploymentTarget:
    iOS: '16.0'
targets:
  OmGanpati:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Web]
      - path: App/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.omganpati.jewellery
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Om Ganpati
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connect to your POSIFLOW printer to print jewellery tags.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan jewellery QR codes and photograph HUID engravings.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: '1.2'
        CURRENT_PROJECT_VERSION: '3'
        CODE_SIGN_STYLE: Automatic
